/* =============================================================
   style.css — Nil Patel · Agriculture × Innovation
   The interface is deliberately small: paper field-notes over a
   living world. Nothing here competes with the farm.
   ============================================================= */

:root {
  --paper: #f7edd6;
  --paper-deep: #ece0c2;
  --ink: #23302a;
  --ink-soft: #5b6a5d;
  --leaf: #3f7d3c;
  --leaf-deep: #29562a;
  --soil: #7d5533;
  --marigold: #e08a3c;
  --sky: #8dcbe6;
  --night: #101e3a;

  --ui: 'Karla', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;

  --edge: 0 10px 34px rgba(20, 32, 22, 0.24);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html { scroll-behavior: auto; }

body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body.locked { overflow: hidden; height: 100%; }
body.pointing { cursor: pointer; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- the world canvas sits behind everything ---------- */
#scene {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: block;
  z-index: 0;
  touch-action: pan-y;
}

/* the scroll distance the camera journey is mapped onto */
#scroll-track { height: 1000vh; pointer-events: none; }

/* =============================================================
   OPENING
   ============================================================= */
#intro {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 6vh 6vw;
  text-align: center;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(247, 237, 214, 0.10), rgba(35, 48, 42, 0.62) 62%),
    linear-gradient(to bottom, rgba(20, 40, 32, 0.35), rgba(20, 40, 32, 0.78));
  backdrop-filter: blur(3px);
  transition: opacity 0.75s ease, transform 0.75s ease;
}

#intro.is-gone { opacity: 0; transform: scale(1.04); pointer-events: none; }

.intro-inner { max-width: 40rem; }

.intro-eyebrow {
  margin: 0 0 1.4rem;
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  color: rgba(247, 237, 214, 0.72);
}

.intro-name {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(3.2rem, 13vw, 7.5rem);
  line-height: 0.92;
  color: var(--paper);
  text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
}

.intro-title {
  margin: 0.7rem 0 0;
  font-size: clamp(1rem, 3.4vw, 1.4rem);
  color: #b7dd8d;
  letter-spacing: 0.02em;
}

.intro-hero {
  margin: 1.9rem auto 0;
  max-width: 26rem;
  font-family: var(--display);
  font-size: clamp(1.05rem, 4vw, 1.5rem);
  line-height: 1.45;
  color: rgba(247, 237, 214, 0.92);
}

.loader { margin: 2.6rem auto 1.6rem; width: min(19rem, 74vw); }

.loader-rail {
  height: 3px;
  border-radius: 2px;
  background: rgba(247, 237, 214, 0.22);
  overflow: hidden;
}

#bar {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--marigold);
  transition: width 0.35s ease;
}

#load-note {
  margin: 0.7rem 0 0;
  font-size: 0.8rem;
  color: rgba(247, 237, 214, 0.65);
}

.enter-btn {
  font-family: var(--ui);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.01em;
  color: var(--ink);
  background: var(--paper);
  border: 0;
  border-radius: 999px;
  padding: 0.95rem 2.3rem;
  cursor: pointer;
  opacity: 0.35;
  pointer-events: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.4s ease;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
}

#intro.is-ready .enter-btn { opacity: 1; pointer-events: auto; }
.enter-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.36); }
.enter-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.intro-note {
  margin: 1.2rem 0 0;
  font-size: 0.8rem;
  color: rgba(247, 237, 214, 0.6);
}

/* =============================================================
   HUD
   ============================================================= */
#hud {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.9s ease 0.2s;
}

#hud.is-on { opacity: 1; }

.brand {
  position: absolute;
  top: max(1.1rem, env(safe-area-inset-top));
  left: 1.25rem;
  color: var(--paper);
  text-shadow: 0 2px 14px rgba(18, 30, 20, 0.55);
}

.brand-name {
  margin: 0;
  font-family: var(--display);
  font-size: 1.3rem;
  font-weight: 600;
  line-height: 1;
}

.brand-line { margin: 0.25rem 0 0; font-size: 0.78rem; opacity: 0.85; }
.brand-mode { margin: 0.5rem 0 0; font-size: 0.7rem; opacity: 0.6; }

/* ---------- the crop-row navigator ---------- */
#rail {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  pointer-events: auto;
}

.rail-item {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.55rem;
  background: none;
  border: 0;
  padding: 0.3rem 0.35rem;
  cursor: pointer;
  font-family: var(--ui);
  font-size: 0.74rem;
  color: var(--paper);
  text-shadow: 0 2px 10px rgba(18, 30, 20, 0.6);
}

.rail-name {
  opacity: 0;
  transform: translateX(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.rail-seed {
  width: 9px;
  height: 9px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(45deg);
  background: rgba(247, 237, 214, 0.45);
  box-shadow: 0 0 0 1px rgba(35, 48, 42, 0.18);
  transition: background 0.25s ease, transform 0.25s ease;
  flex: none;
}

.rail-item:hover .rail-name,
.rail-item:focus-visible .rail-name,
.rail-item.is-current .rail-name { opacity: 1; transform: translateX(0); }

.rail-item:hover .rail-seed { background: var(--paper); }

.rail-item.is-current .rail-seed {
  background: var(--marigold);
  transform: rotate(45deg) scale(1.35);
}

/* ---------- controls ---------- */
.controls {
  position: absolute;
  left: 50%;
  bottom: calc(1.1rem + var(--safe-b));
  transform: translateX(-50%);
  display: flex;
  gap: 0.4rem;
  padding: 0.35rem;
  border-radius: 999px;
  background: rgba(35, 48, 42, 0.42);
  backdrop-filter: blur(8px);
  pointer-events: auto;
}

.controls button {
  font-family: var(--ui);
  font-size: 0.78rem;
  color: var(--paper);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s ease, color 0.2s ease;
}

.controls button:hover { background: rgba(247, 237, 214, 0.16); }

.controls button[aria-pressed="true"] {
  background: var(--marigold);
  color: #2a1c0b;
  font-weight: 700;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(4.4rem + var(--safe-b));
  transform: translateX(-50%);
  margin: 0;
  font-size: 0.75rem;
  color: rgba(247, 237, 214, 0.8);
  text-shadow: 0 2px 10px rgba(18, 30, 20, 0.6);
  animation: bob 2.8s ease-in-out infinite;
  transition: opacity 0.5s ease;
}

#hint.is-gone { opacity: 0; }

@keyframes bob {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, 5px); }
}

/* ---------- hover tooltip ---------- */
#tip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 30;
  padding: 0.42rem 0.75rem;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-size: 0.76rem;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease;
  box-shadow: var(--edge);
}

#tip.is-on { opacity: 1; }

/* =============================================================
   FIELD NOTE PANEL
   ============================================================= */
#panel {
  position: fixed;
  z-index: 25;
  left: 1.25rem;
  bottom: calc(1.25rem + var(--safe-b));
  width: min(25rem, calc(100vw - 2.5rem));
  max-height: min(66vh, 40rem);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1.5rem 1.6rem 1.7rem;
  background: var(--paper);
  border-left: 5px solid var(--leaf);
  border-radius: 3px 14px 14px 3px;
  box-shadow: var(--edge);
  opacity: 0;
  transform: translateY(14px) scale(0.985);
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

#panel.is-open { opacity: 1; transform: none; pointer-events: auto; }

#panel-close {
  position: absolute;
  top: 0.85rem;
  right: 0.85rem;
  font-family: var(--ui);
  font-size: 0.72rem;
  color: var(--ink-soft);
  background: var(--paper-deep);
  border: 0;
  border-radius: 999px;
  padding: 0.35rem 0.8rem;
  cursor: pointer;
}

#panel-close:hover { background: var(--marigold); color: #2a1c0b; }

#panel .kicker {
  margin: 0 0 0.35rem;
  font-size: 0.74rem;
  color: var(--soil);
}

#panel h2 {
  margin: 0 0 0.8rem;
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.9rem;
  line-height: 1.05;
  color: var(--leaf-deep);
  padding-right: 3.5rem;
}

#panel h3 {
  margin: 1.1rem 0 0.4rem;
  font-family: var(--ui);
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--soil);
}

#panel p { margin: 0 0 0.7rem; font-size: 0.92rem; line-height: 1.55; max-width: 34ch; }

#panel .lead {
  font-family: var(--display);
  font-size: 1.12rem;
  line-height: 1.4;
  color: var(--ink);
}

#panel .sub { color: var(--ink-soft); font-size: 0.86rem; }

#panel .years {
  font-family: var(--display);
  font-size: 1.5rem;
  color: var(--marigold);
  margin-bottom: 0.3rem;
}

#panel .facts { margin: 0.9rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 1rem; }
#panel .facts dt { font-size: 0.76rem; color: var(--soil); }
#panel .facts dd { margin: 0; font-size: 0.9rem; }

#panel .rows { margin: 0; padding: 0; list-style: none; }

#panel .rows li {
  position: relative;
  padding: 0.3rem 0 0.3rem 1.1rem;
  font-size: 0.9rem;
  line-height: 1.4;
  border-bottom: 1px solid rgba(125, 85, 51, 0.16);
}

#panel .rows li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.72em;
  width: 6px;
  height: 6px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(45deg);
  background: var(--leaf);
}

#panel .entry { padding: 0.6rem 0; border-top: 1px solid rgba(125, 85, 51, 0.18); }
#panel .entry:first-of-type { border-top: 0; }
#panel .entry-head { margin: 0 0 0.15rem; font-weight: 700; font-size: 0.95rem; }
#panel .entry-meta { margin: 0 0 0.1rem; font-size: 0.85rem; color: var(--ink-soft); }
#panel .entry-when { margin: 0; font-size: 0.8rem; color: var(--marigold); }

#panel .tags { margin: 0.4rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.45rem; }

#panel .tags li {
  padding: 0.4rem 0.8rem;
  border-radius: 999px;
  background: var(--paper-deep);
  font-size: 0.84rem;
}

#panel .cta {
  display: inline-block;
  margin-top: 0.9rem;
  padding: 0.72rem 1.4rem;
  border-radius: 999px;
  background: var(--leaf);
  color: var(--paper);
  font-weight: 700;
  font-size: 0.88rem;
  text-decoration: none;
  transition: background 0.2s ease, transform 0.2s ease;
}

#panel .cta:hover { background: var(--leaf-deep); transform: translateY(-1px); }

#panel .foot {
  margin-top: 1.2rem;
  padding-top: 0.9rem;
  border-top: 1px solid rgba(125, 85, 51, 0.2);
  font-size: 0.76rem;
  color: var(--ink-soft);
}

/* =============================================================
   FOCUS VISIBILITY & MOTION PREFERENCES
   ============================================================= */
:focus-visible {
  outline: 3px solid var(--marigold);
  outline-offset: 3px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  #hint { animation: none; }
  #panel, #intro, .enter-btn { transition-duration: 0.01ms; }
}

/* =============================================================
   MOBILE — the panel becomes a sheet, the rail becomes a strip
   ============================================================= */
@media (max-width: 820px), (pointer: coarse) {
  #panel {
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    max-height: 58vh;
    padding: 1.3rem 1.2rem calc(1.5rem + var(--safe-b));
    border-left: 0;
    border-top: 5px solid var(--leaf);
    border-radius: 18px 18px 0 0;
    transform: translateY(100%);
  }

  #panel.is-open { transform: translateY(0); }
  #panel h2 { font-size: 1.6rem; }
  #panel p { max-width: none; }

  .controls {
    bottom: calc(0.6rem + var(--safe-b));
    gap: 0.15rem;
    padding: 0.3rem;
    max-width: calc(100vw - 1rem);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .controls::-webkit-scrollbar { display: none; }
  .controls button { padding: 0.55rem 0.7rem; font-size: 0.72rem; }

  #rail { right: 0.4rem; gap: 0.35rem; }
  .rail-item { padding: 0.4rem 0.25rem; }
  .rail-name { display: none; }
  .rail-item.is-current .rail-name { display: inline; opacity: 1; transform: none; }
  .rail-seed { width: 11px; height: 11px; }

  #hint { bottom: calc(3.6rem + var(--safe-b)); }
  .brand-mode { display: none; }
}

/* when the panel is open on a phone, keep the controls reachable */
@media (max-width: 820px) {
  body.is-night .controls { background: rgba(16, 30, 58, 0.6); }
}

/* =============================================================
   NO JAVASCRIPT
   ============================================================= */
.noscript {
  position: relative;
  z-index: 50;
  margin: 0 auto;
  padding: 3rem 1.5rem;
  max-width: 42rem;
  background: var(--paper);
  min-height: 100vh;
}

.noscript h1 { font-family: var(--display); color: var(--leaf-deep); }
.noscript a { color: var(--leaf); }

/* =============================================================
   CINEMATIC GRADE — purely decorative overlay, sits between the
   canvas (z-index 0) and the HUD (z-index 20). Never intercepts
   input: pointer-events is off throughout.
   ============================================================= */
#scene {
  filter: saturate(1.07) contrast(1.035);
}

#grade {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background:
    radial-gradient(140% 100% at 50% 8%, rgba(255, 244, 214, 0.10), transparent 46%),
    radial-gradient(120% 90% at 50% 108%, rgba(10, 16, 12, 0.32), transparent 55%),
    radial-gradient(160% 130% at 50% 50%, transparent 58%, rgba(8, 14, 10, 0.20) 100%);
  mix-blend-mode: multiply;
  transition: opacity 1.1s ease;
}
body.is-night #grade {
  background:
    radial-gradient(140% 100% at 50% 6%, rgba(160, 190, 255, 0.06), transparent 44%),
    radial-gradient(120% 90% at 50% 110%, rgba(3, 6, 14, 0.5), transparent 58%),
    radial-gradient(160% 130% at 50% 50%, transparent 52%, rgba(2, 5, 12, 0.38) 100%);
}
#grade::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0px, transparent 1px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0px, transparent 1px, transparent 3px);
  background-size: 3px 3px, 5px 5px;
}

/* =============================================================
   DRIFTING MOTES — pollen by day, fireflies by night. Fourteen
   spans, each with its own path/speed/delay so the drift never
   visibly repeats in sync.
   ============================================================= */
#motes {
  position: fixed;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  overflow: hidden;
}
#motes span {
  position: absolute;
  bottom: -4vh;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,250,230,0.95), rgba(255,250,230,0));
  opacity: 0;
  animation: mote-rise linear infinite;
  filter: blur(0.2px);
}
body.is-night #motes span {
  background: radial-gradient(circle, rgba(255,214,140,1), rgba(255,180,90,0));
  box-shadow: 0 0 6px 1px rgba(255, 180, 90, 0.55);
  animation-name: mote-rise-night;
}
@keyframes mote-rise {
  0%   { transform: translate(0, 0) scale(0.7); opacity: 0; }
  10%  { opacity: 0.55; }
  50%  { transform: translate(3vw, -46vh) scale(1); }
  90%  { opacity: 0.35; }
  100% { transform: translate(-2vw, -96vh) scale(0.6); opacity: 0; }
}
@keyframes mote-rise-night {
  0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
  12%  { opacity: 0.9; }
  50%  { transform: translate(-4vw, -42vh) scale(1.15); }
  88%  { opacity: 0.5; }
  100% { transform: translate(3vw, -92vh) scale(0.5); opacity: 0; }
}
#motes span:nth-child(1)  { left: 6%;  animation-duration: 19s; animation-delay: -2s; }
#motes span:nth-child(2)  { left: 14%; animation-duration: 23s; animation-delay: -9s; }
#motes span:nth-child(3)  { left: 22%; animation-duration: 17s; animation-delay: -4s; }
#motes span:nth-child(4)  { left: 31%; animation-duration: 26s; animation-delay: -14s; }
#motes span:nth-child(5)  { left: 39%; animation-duration: 20s; animation-delay: -7s; }
#motes span:nth-child(6)  { left: 47%; animation-duration: 24s; animation-delay: -1s; }
#motes span:nth-child(7)  { left: 55%; animation-duration: 18s; animation-delay: -11s; }
#motes span:nth-child(8)  { left: 63%; animation-duration: 27s; animation-delay: -5s; }
#motes span:nth-child(9)  { left: 71%; animation-duration: 21s; animation-delay: -16s; }
#motes span:nth-child(10) { left: 79%; animation-duration: 19s; animation-delay: -8s; }
#motes span:nth-child(11) { left: 87%; animation-duration: 25s; animation-delay: -3s; }
#motes span:nth-child(12) { left: 93%; animation-duration: 22s; animation-delay: -12s; }
#motes span:nth-child(13) { left: 10%; animation-duration: 29s; animation-delay: -18s; }
#motes span:nth-child(14) { left: 66%; animation-duration: 16s; animation-delay: -6s; }

@media (prefers-reduced-motion: reduce) {
  #motes { display: none; }
  #scene { filter: none; }
}
@media (max-width: 640px) {
  #motes span:nth-child(n+9) { display: none; } /* fewer motes on phones — keeps it light */
}

/* =============================================================
   MICRO-POLISH — intro title glow + refined hover states.
   Additive only; new motion only introduced under the site's
   own reduced-motion no-preference guard.
   ============================================================= */
.intro-name {
  text-shadow: 0 0 34px rgba(255, 236, 190, 0.35), 0 2px 0 rgba(20, 32, 22, 0.18);
}

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('cine-intro');
  if (!root) return;

  if (reduceMotion) {
    root.classList.add('cine-hidden');
    return;
  }

  var s1 = document.getElementById('cine-s1');
  var s2 = document.getElementById('cine-s2');
  var s3 = document.getElementById('cine-s3');
  var skip = document.getElementById('cine-skip');
  var timers = [];
  var finished = false;

  // build cloud field for scene 2
  var cloudCount = 16;
  for (var i = 0; i < cloudCount; i++) {
    var c = document.createElement('div');
    c.className = 'cine-cloud';
    var size = 18 + Math.random() * 32; // vw
    var top = Math.random() * 100;
    var delay = Math.random() * 0.9;
    var dur = 1.0 + Math.random() * 0.7;
    c.style.width = size + 'vw';
    c.style.height = (size * 0.55) + 'vw';
    c.style.top = top + '%';
    c.style.animationDelay = delay + 's';
    c.style.animationDuration = dur + 's';
    s2.appendChild(c);
  }
  var flash = document.createElement('div');
  flash.className = 'cine-flash';
  s2.appendChild(flash);

  // build soft particles for scene 3
  for (var p = 0; p < 26; p++) {
    var dot = document.createElement('div');
    dot.className = 'cine-particle';
    var ds = 2 + Math.random() * 4;
    dot.style.width = ds + 'px';
    dot.style.height = ds + 'px';
    dot.style.left = (Math.random() * 100) + '%';
    dot.style.top = (Math.random() * 100) + '%';
    dot.style.animationDelay = (Math.random() * 3) + 's, ' + (Math.random() * 0.8) + 's';
    s3.appendChild(dot);
  }

  function clearTimers() {
    timers.forEach(function (t) { clearTimeout(t); });
    timers = [];
  }

  function finish() {
    if (finished) return;
    finished = true;
    clearTimers();
    root.classList.add('cine-fadeout');
    setTimeout(function () {
      root.classList.add('cine-hidden');
    }, 720);
  }

  function play() {
    timers.push(setTimeout(function () { s1.classList.add('cine-out'); s2.classList.add('cine-active'); }, 2150));
    timers.push(setTimeout(function () { s2.classList.remove('cine-active'); s3.classList.add('cine-active'); }, 3550));
    timers.push(setTimeout(finish, 5900));
  }

  skip.addEventListener('click', finish);
  play();
})();
</script>

          '  vec3 npI = instanceMatrix[3].xyz;\n' +
          '#else\n' +
          '  vec3 npI = vec3(0.0);\n' +
          '#endif\n' +
          '  float npH = max(transformed.y, 0.0);\n' +
          '  float npS = sin(uTime * 1.5 + npI.x * 0.4 + npI.z * 0.31) + 0.4 * sin(uTime * 2.7 + npI.z * 0.7);\n' +
          '  transformed.x += npS * uWind * npH;\n' +
          '  transformed.z += npS * uWind * 0.45 * npH;\n');
    };
    material.customProgramCacheKey = function () { return 'npwind' + strength; };
    return material;
  }

  /* ---------- crop field: instanced plants on tilled soil ---------- */
  function buildField(group, opt) {
    var g = new THREE.Group();
    g.position.set(opt.x, 0, opt.z);
    if (opt.rot) g.rotation.y = opt.rot;

    var soil = box(opt.w, 0.18, opt.d, opt.soil || C.soilDark, 0, 0.09, 0, { flat: true });
    soil.castShadow = false;
    g.add(soil);

    // furrow ridges
    var ridges = Math.max(2, Math.round(opt.rows));
    for (var r = 0; r < ridges; r++) {
      var rz = -opt.d / 2 + (r + 0.5) * (opt.d / ridges);
      var ridge = box(opt.w * 0.98, 0.12, opt.d / ridges * 0.42, opt.soilLight || C.soil, 0, 0.2, rz);
      ridge.castShadow = false;
      g.add(ridge);
    }

    // plants
    var count = opt.count;
    var geo = opt.geo || new THREE.ConeGeometry(0.16, 0.62, 5);
    geo.translate(0, 0.31, 0);
    var m = windify(mat(opt.crop || C.crop), opt.wind || 0.14);
    m.vertexColors = true;
    var inst = new THREE.InstancedMesh(geo, m, count);
    inst.castShadow = true;
    inst.receiveShadow = false;
    var dummy = new THREE.Object3D();
    var col = new THREE.Color(), cA = new THREE.Color(opt.crop || C.crop), cB = new THREE.Color(opt.crop2 || C.cropYoung);
    var per = Math.ceil(count / ridges), n = 0;
    for (var i = 0; i < ridges && n < count; i++) {
      var z = -opt.d / 2 + (i + 0.5) * (opt.d / ridges);
      for (var j = 0; j < per && n < count; j++) {
        var x = -opt.w / 2 + (j + 0.5) * (opt.w / per) + (rnd() - 0.5) * 0.18;
        dummy.position.set(x, 0.22, z + (rnd() - 0.5) * 0.18);
        var s = (opt.scale || 1) * (0.75 + rnd() * 0.6);
        dummy.scale.set(s, s * (0.8 + rnd() * 0.5), s);
        dummy.rotation.y = rnd() * Math.PI;
        dummy.updateMatrix();
        inst.setMatrixAt(n, dummy.matrix);
        col.copy(cA).lerp(cB, rnd());
        inst.setColorAt(n, col);
        n++;
      }
    }
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    g.add(inst);
    group.add(g);
    return g;
  }

  /* ---------- trees ---------- */
  function buildTree(x, z, s, kind) {
    var g = new THREE.Group();
    g.position.set(x, terrainHeight(x, z), z);
    s = s || 1;
    if (kind === 'palm') {
      var tr = cyl(0.22 * s, 0.34 * s, 3.6 * s, 7, C.woodDark, 0, 1.8 * s, 0);
      g.add(tr);
      for (var i = 0; i < 7; i++) {
        var frond = box(2.6 * s, 0.1 * s, 0.5 * s, i % 2 ? C.leafDeep : C.crop, 0, 0, 0);
        frond.position.set(Math.cos(i / 7 * Math.PI * 2) * 1.2 * s, 3.6 * s, Math.sin(i / 7 * Math.PI * 2) * 1.2 * s);
        frond.rotation.y = i / 7 * Math.PI * 2;
        frond.rotation.z = -0.35;
        g.add(frond);
      }
      var dates = sphere(0.28 * s, C.marigold, 0, 3.3 * s, 0);
      g.add(dates);
    } else {
      var trunk = cyl(0.24 * s, 0.36 * s, 2.2 * s, 6, C.wood, 0, 1.1 * s, 0);
      g.add(trunk);
      var f1 = sphere(1.35 * s, C.leafDeep, 0, 2.9 * s, 0);
      var f2 = sphere(1.0 * s, C.crop, 0.85 * s, 2.4 * s, 0.35 * s);
      var f3 = sphere(0.85 * s, C.cropYoung, -0.7 * s, 2.5 * s, -0.45 * s);
      g.add(f1); g.add(f2); g.add(f3);
      g.userData.canopy = [f1, f2, f3];
    }
    g.userData.phase = rnd() * Math.PI * 2;
    return g;
  }

  /* ---------- fence ---------- */
  function fenceLine(ax, az, bx, bz) {
    var g = new THREE.Group();
    var dx = bx - ax, dz = bz - az;
    var len = Math.sqrt(dx * dx + dz * dz);
    var n = Math.max(2, Math.round(len / 2.4));
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      var px = ax + dx * t, pz = az + dz * t;
      var post = box(0.16, 1.15, 0.16, C.wood, px, 0.55 + terrainHeight(px, pz), pz);
      g.add(post);
    }
    var ang = Math.atan2(dz, dx);
    for (var k = 0; k < 2; k++) {
      var rail = box(len, 0.1, 0.08, C.woodDark, (ax + bx) / 2, 0.55 + 0.28 * (k ? 1 : -1), (az + bz) / 2);
      rail.rotation.y = -ang;
      g.add(rail);
    }
    return g;
  }

  function buildPond(x, z) {
    var g = new THREE.Group();
    g.position.set(x, 0, z);
    var rim = cyl(4.4, 4.6, 0.3, 22, C.soil, 0, 0.05, 0);

    g.add(rim);
    var geo = new THREE.CircleGeometry(4.1, 26);
    geo.rotateX(-Math.PI / 2);
    var m = new THREE.MeshLambertMaterial({ color: C.water, transparent: true, opacity: 0.85, flatShading: false });
    m.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = ctx.timeUniform;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nuniform float uTime;')
        .replace('#include <begin_vertex>',
          '#include <begin_vertex>\n transformed.y += sin(transformed.x * 1.2 + uTime * 1.6) * 0.06 + cos(transformed.z * 1.5 + uTime * 1.1) * 0.05;');
    };
    m.customProgramCacheKey = function () { return 'npwater'; };
    var water = new THREE.Mesh(geo, m);
    water.position.y = 0.18;
    water.receiveShadow = true;
    g.add(water);
    // lily pads
    for (var i = 0; i < 5; i++) {
      var a = rnd() * Math.PI * 2, r = 1 + rnd() * 2.6;
      var pad = cyl(0.35, 0.35, 0.05, 8, C.leafDeep, Math.cos(a) * r, 0.24, Math.sin(a) * r);
      pad.castShadow = false;
      g.add(pad);

    return g;
  }

  function buildSprinkler(x, z) {
    var g = new THREE.Group();
    g.position.set(x, 0, z);
    g.add(cyl(0.08, 0.1, 1.4, 6, C.metal, 0, 0.7, 0));
    var head = sphere(0.16, C.metalDark, 0, 1.45, 0);
    g.add(head);
    // water particle spray
    var N = 60;
    var pos = new Float32Array(N * 3), seeds = [];
    for (var i = 0; i < N; i++) {
      seeds.push({ a: rnd() * Math.PI * 2, t: rnd(), sp: 0.5 + rnd() * 0.5 });
      pos[i * 3] = 0; pos[i * 3 + 1] = 1.45; pos[i * 3 + 2] = 0;
    }
    var pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var pm = new THREE.PointsMaterial({ color: 0xbfe7f5, size: 0.11, transparent: true, opacity: 0.85, depthWrite: false });
    var pts = new THREE.Points(pg, pm);
    g.add(pts);
    g.userData.spray = { pts: pts, seeds: seeds };
    return g;
  }

  /* ---------- clouds & birds & pollen ---------- */
  function buildClouds(group) {
    var clouds = [];
    for (var i = 0; i < 9; i++) {
      var cg = new THREE.Group();
      var n = 3 + Math.floor(rnd() * 3);
      for (var j = 0; j < n; j++) {
        var puff = sphere(1.6 + rnd() * 1.5, 0xfbf7ee, (j - n / 2) * 1.9 + rnd(), rnd() * 0.7, rnd() * 1.4, { transparent: true, opacity: 0.92 });
        puff.castShadow = false; puff.receiveShadow = false;
        cg.add(puff);
      }
      cg.position.set(-90 + rnd() * 180, 26 + rnd() * 14, -90 + rnd() * 180);
      cg.userData.speed = 0.25 + rnd() * 0.35;
      cg.scale.setScalar(1 + rnd() * 0.8);
      group.add(cg);
      clouds.push(cg);
    }
    return clouds;
  }

  function buildBirds(group) {
    var birds = [];
    for (var i = 0; i < 5; i++) {
      var b = new THREE.Group();
      var l = box(0.55, 0.04, 0.16, 0x3a3f45, -0.25, 0, 0);
      var r = box(0.55, 0.04, 0.16, 0x3a3f45, 0.25, 0, 0);
      l.castShadow = false; r.castShadow = false;
      b.add(l); b.add(r);
      b.userData = { l: l, r: r, a: rnd() * Math.PI * 2, rad: 22 + rnd() * 26, y: 15 + rnd() * 9, sp: 0.1 + rnd() * 0.08 };
      group.add(b);
      birds.push(b);
    }
    return birds;
  }

  function buildPollen(group, count) {
    var pos = new Float32Array(count * 3), seeds = [];
    for (var i = 0; i < count; i++) {
      var x = -40 + rnd() * 80, y = rnd() * 7, z = -40 + rnd() * 80;
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      seeds.push({ x: x, y: y, z: z, ph: rnd() * Math.PI * 2, sp: 0.25 + rnd() * 0.5 });
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({ color: 0xffe9a8, size: 0.16, transparent: true, opacity: 0.75, depthWrite: false });
    var pts = new THREE.Points(g, m);
    pts.frustumCulled = false;
    group.add(pts);
    return { pts: pts, seeds: seeds };
  }

  /* =========================================================
     BUILD
     ========================================================= */
  function build(scene, opts) {
    THREE = root.THREE;
    opts = opts || {};
    rnd = mulberry(20260906);
    ctx = {
      timeUniform: { value: 0 },
      nightLights: [],
      nightGlow: []
    };

    var mobile = !!opts.mobile;
    var root_ = new THREE.Group();
    scene.add(root_);

    buildTerrain(root_);

    /* the journey loop, in story order, also drawn as a dirt path */
    var stations = [
      [0, 24], [-16, 14], [-22, -4], [-8, -20], [12, -24], [26, -8], [24, 10], [12, 26], [0, 38]
    ];
    var pathPts = stations.map(function (s) { return new THREE.Vector3(s[0] * 0.86, 0, s[1] * 0.86); });
    buildPath(root_, pathPts);

    /* the working farm in the middle of the loop */
    buildField(root_, { x: -2, z: 4, w: 14, d: 10, rows: 7, count: mobile ? 320 : 700, scale: 1.0 });
    buildField(root_, { x: 12, z: -6, w: 9, d: 8, rows: 5, count: mobile ? 180 : 380, crop: C.cropYoung, crop2: C.sun, scale: 0.9 });
    buildField(root_, { x: -14, z: -12, w: 10, d: 7, rows: 5, count: mobile ? 170 : 360, crop: C.leafDeep, crop2: C.crop, scale: 1.1 });
    buildField(root_, { x: 18, z: 18, w: 11, d: 8, rows: 6, count: mobile ? 200 : 420, crop: C.crop, crop2: C.cropYoung, scale: 0.95, rot: 0.4 });
    buildField(root_, { x: -24, z: 22, w: 9, d: 7, rows: 5, count: mobile ? 150 : 300, crop: C.sun, crop2: C.marigold, scale: 0.8 });

    var pond = buildPond(6, 12);
    root_.add(pond);
    var windmill = buildWindmill(7, -2);
    root_.add(windmill);
    root_.add(buildWaterTank(4, -14));
    root_.add(buildTractor(-1, 15, -0.6));
    var scarecrow = buildScarecrow(-6, 6);
    root_.add(scarecrow);

    var sprinklers = [];
    [[-4, 1], [1, 7], [10, -4]].forEach(function (p) {
      var s = buildSprinkler(p[0], p[1]);
      root_.add(s);
      sprinklers.push(s);
    });

    /* fences framing the inner farm */
    root_.add(fenceLine(-11, 12, 9, 12));
    root_.add(fenceLine(9, 12, 9, -2));
    root_.add(fenceLine(-11, 12, -11, -2));

    /* trees: rings of them, plus date palms near the greenhouse */
    var treeSpots = [
      [-19, 20, 1.15], [-25, 8, 1.0], [-28, -12, 1.2], [-15, -26, 0.95],
      [3, -30, 1.1], [20, -30, 1.0], [32, -18, 1.15], [34, 2, 1.05],
      [30, 20, 1.2], [18, 30, 1.0], [7.5, 34, 1.05], [-10, 30, 0.95],
      [-33, 24, 1.2], [-36, -2, 1.05], [-20, 32, 1.0], [26, 28, 0.9]
    ];
    var trees = [];
    treeSpots.forEach(function (s) {
      var t = buildTree(s[0], s[1], s[2]);
      root_.add(t);
      trees.push(t);
    });
    [[6, -28, 1.0], [8.5, -30, 0.9], [3.5, -30.5, 1.05], [17, -30, 0.95]].forEach(function (s) {
      var p = buildTree(s[0], s[1], s[2], 'palm');
      root_.add(p);
      trees.push(p);
    });

    /* the nine interactive stations */
    var farmhouse = buildFarmhouse([0, 0, 24]);
    var study = buildStudy([-16, 0, 14]);
    var garden = buildSkillGarden([-22, 0, -4]);
    var bench = buildWorkbench([-8, 0, -20]);
    var greenhouse = buildGreenhouse([12, 0, -24]);
    var certificate = buildCertificate([26, 0, -8]);
    var sensors = buildSensorField([24, 0, 10]);
    var vision = buildVisionBoard([12, 0, 26]);
    var gate = buildGate([0, 0, 38]);
    var noticeboard = buildNoticeboard([4.5, 0, 44]);

    var interactive = [
      { id: 'farmhouse', obj: farmhouse, focus: [0, 2.6, 24], r: 4.6 },
      { id: 'books', obj: study, focus: [-16, 1.7, 14], r: 2.6 },
      { id: 'garden', obj: garden, focus: [-22, 1.4, -4], r: 4.4 },
      { id: 'laptop', obj: bench, focus: [-8, 1.6, -20], r: 2.8 },
      { id: 'greenhouse', obj: greenhouse, focus: [12, 2.2, -24], r: 5.6 },
      { id: 'certificate', obj: certificate, focus: [26, 1.9, -8], r: 2.4 },
      { id: 'sensors', obj: sensors, focus: [24, 2.8, 10], r: 4.2 },
      { id: 'visionboard', obj: vision, focus: [12, 3.2, 26], r: 3.6 },
      { id: 'gate', obj: gate, focus: [0, 2.6, 38], r: 4.4 },
      { id: 'noticeboard', obj: noticeboard, focus: [4.5, 2.3, 44], r: 2.8 }
    ];
    interactive.forEach(function (it) {
      it.obj.userData.npId = it.id;
      it.obj.traverse(function (c) { c.userData.npRoot = it.obj; });
      root_.add(it.obj);
    });

    /* sky elements */
    var clouds = buildClouds(root_);
    var birds = buildBirds(root_);
    var pollen = buildPollen(root_, mobile ? 90 : 200);

    /* far hills for depth */
    for (var h = 0; h < 14; h++) {
      var a = h / 14 * Math.PI * 2 + 0.2;
      var r = 105 + rnd() * 30;
      var hill = sphere(9 + rnd() * 9, h % 2 ? 0x5f8f57 : 0x6b9a5c, Math.cos(a) * r, -2 + rnd() * 2, Math.sin(a) * r);
      hill.scale.set(1.6, 0.55, 1.6);
      hill.castShadow = false;
      root_.add(hill);
    }

    /* -------- animation -------- */
    var tmpV = new THREE.Vector3();
    function animate(t, dt) {
      ctx.timeUniform.value = t;

      // trees breathe
      for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        tr.rotation.z = Math.sin(t * 0.7 + tr.userData.phase) * 0.017;
        tr.rotation.x = Math.cos(t * 0.53 + tr.userData.phase) * 0.012;
      }
      // clouds drift and wrap
      for (var c = 0; c < clouds.length; c++) {
        var cl = clouds[c];
        cl.position.x += cl.userData.speed * dt * 1.4;
        if (cl.position.x > 110) cl.position.x = -110;
      }
      // birds circle
      for (var b = 0; b < birds.length; b++) {
        var bd = birds[b], u = bd.userData;
        u.a += u.sp * dt;
        bd.position.set(Math.cos(u.a) * u.rad, u.y + Math.sin(u.a * 2) * 1.2, Math.sin(u.a) * u.rad);
        bd.rotation.y = -u.a;
        var flap = Math.sin(t * 8 + b) * 0.5;
        u.l.rotation.z = flap; u.r.rotation.z = -flap;
      }
      // pollen floats
      var pp = pollen.pts.geometry.attributes.position;
      for (var p = 0; p < pollen.seeds.length; p++) {
        var s = pollen.seeds[p];
        var y = (s.y + t * s.sp * 0.6) % 7;
        pp.setXYZ(p, s.x + Math.sin(t * 0.5 + s.ph) * 1.4, y + 0.4, s.z + Math.cos(t * 0.4 + s.ph) * 1.4);
      }
      pp.needsUpdate = true;
      // windmill
      windmill.userData.rotor.rotation.z += dt * 0.9;
      // scarecrow sways
      scarecrow.rotation.z = Math.sin(t * 1.1) * 0.035;
      // sprinklers
      for (var k = 0; k < sprinklers.length; k++) {
        var sp = sprinklers[k].userData.spray;
        var arr = sp.pts.geometry.attributes.position;
        for (var q = 0; q < sp.seeds.length; q++) {
          var sd = sp.seeds[q];
          var lt = (sd.t + t * 0.5 * sd.sp) % 1;
          var rr = lt * 2.4;
          arr.setXYZ(q, Math.cos(sd.a + t * 0.9) * rr, 1.45 + Math.sin(lt * Math.PI) * 0.9 - lt * 0.4, Math.sin(sd.a + t * 0.9) * rr);
        }
        arr.needsUpdate = true;
      }
      // chimney smoke
      var smoke = farmhouse.userData.smoke;
      if (smoke) {
        for (var sm = 0; sm < smoke.children.length; sm++) {
          var puff = smoke.children[sm];
          puff.position.y += dt * 0.35;
          puff.position.x = -1.9 + Math.sin(t * 0.7 + sm) * 0.35;
          if (puff.position.y > 8.6) puff.position.y = 5.4;
          puff.material.opacity = Math.max(0, 0.5 - sm * 0.09) * (1 - (puff.position.y - 5.4) / 3.6);
        }
      }
      // laptop breathing glow
      if (bench.userData.glow) {
        bench.userData.glow.intensity = 0.75 + Math.sin(t * 2.2) * 0.2;
        bench.userData.screenMat.emissiveIntensity = 0.68 + Math.sin(t * 2.2) * 0.12;
      }
      // drone + rotors + leds + holo
      var sf = sensors.userData;
      if (sf.drone) {
        sf.drone.position.y = 4.0 + Math.sin(t * 1.3) * 0.28;
        sf.drone.position.x = 0.2 + Math.sin(t * 0.35) * 1.2;
        sf.drone.position.z = 1.6 + Math.cos(t * 0.35) * 1.0;
        sf.drone.rotation.y = -t * 0.35 + Math.PI / 2;
        for (var rr2 = 0; rr2 < sf.drone.userData.rotors.length; rr2++) {
          sf.drone.userData.rotors[rr2].rotation.y += dt * 26;
        }
      }
      if (sf.masts) {
        for (var mI = 0; mI < sf.masts.length; mI++) {
          var led = sf.masts[mI].userData.led;
          led.material.emissiveIntensity = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.6 + sf.masts[mI].userData.phase));
        }
      }
      if (sf.holo) {
        sf.holo.position.y = 4.6 + Math.sin(t * 0.9) * 0.16;
        sf.holo.material.opacity = 0.82 + Math.sin(t * 1.7) * 0.08;
      }
      // contact phone gently turns
      if (gate.userData.phone) {
        gate.userData.phone.rotation.y = 0.4 + Math.sin(t * 0.8) * 0.25;
      }
      tmpV.set(0, 0, 0);
    }

    /* -------- day / night blending -------- */
    function setNight(k) {
      for (var i = 0; i < ctx.nightLights.length; i++) {
        ctx.nightLights[i].light.intensity = ctx.nightLights[i].intensity * k;
      }
      for (var j = 0; j < ctx.nightGlow.length; j++) {
        var grp = ctx.nightGlow[j];
        for (var m = 0; m < grp.mats.length; m++) {
          grp.mats[m].emissive.setHex(grp.color);
          grp.mats[m].emissiveIntensity = grp.intensity * k;
        }
      }
    }
    setNight(0);

    return {
      root: root_,
      interactive: interactive,
      animate: animate,
      setNight: setNight,
      heightAt: terrainHeight,
      palette: C
    };
  }

  root.NPWorld = { build: build, palette: C, heightAt: terrainHeight };
})(typeof window !== 'undefined' ? window : globalThis);

/* =============================================================
   audio.js — ambience generated in the browser with WebAudio.
   Wind, a low warm pad and occasional birdsong. No audio files,
   nothing to download, nothing borrowed.
   ============================================================= */
(function (root) {
  'use strict';

  var AC = root.AudioContext || root.webkitAudioContext;

  function Ambience() {
    this.ctx = null;
    this.master = null;
    this.on = false;
    this.timer = null;
  }

  Ambience.prototype.init = function () {
    if (this.ctx || !AC) return;
    var ctx = this.ctx = new AC();
    var master = this.master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    // --- wind: filtered noise with a slow sweeping filter ---
    var len = ctx.sampleRate * 4;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    }
    var wind = ctx.createBufferSource();
    wind.buffer = buf;
    wind.loop = true;
    var windFilter = ctx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 420;
    var windGain = ctx.createGain();
    windGain.gain.value = 0.5;
    wind.connect(windFilter).connect(windGain).connect(master);
    wind.start();

    var lfo = ctx.createOscillator();
    lfo.frequency.value = 0.06;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 220;
    lfo.connect(lfoGain).connect(windFilter.frequency);
    lfo.start();

    // --- warm pad: two detuned sines, very quiet ---
    var padGain = ctx.createGain();
    padGain.gain.value = 0.045;
    padGain.connect(master);
    [110, 164.81, 220].forEach(function (f, idx) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * (idx === 1 ? 1.002 : 1);
      var g = ctx.createGain();
      g.gain.value = idx === 2 ? 0.25 : 0.5;
      o.connect(g).connect(padGain);
      o.start();
    });

    this.scheduleBird();
  };

  Ambience.prototype.chirp = function () {
    if (!this.ctx || !this.on) return;
    var ctx = this.ctx, t = ctx.currentTime;
    var notes = 2 + Math.floor(Math.random() * 3);
    for (var n = 0; n < notes; n++) {
      var start = t + n * (0.09 + Math.random() * 0.06);
      var o = ctx.createOscillator();
      o.type = 'sine';
      var base = 1500 + Math.random() * 1400;
      o.frequency.setValueAtTime(base, start);
      o.frequency.exponentialRampToValueAtTime(base * (1.3 + Math.random() * 0.5), start + 0.05);
      o.frequency.exponentialRampToValueAtTime(base * 0.75, start + 0.11);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.07, start + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      o.connect(g).connect(this.master);
      o.start(start);
      o.stop(start + 0.16);
    }
  };

  Ambience.prototype.scheduleBird = function () {
    var self = this;
    clearTimeout(this.timer);
    this.timer = setTimeout(function () {
      self.chirp();
      self.scheduleBird();
    }, 3500 + Math.random() * 7000);
  };

  /* short, soft confirmation tone when a panel opens */
  Ambience.prototype.blip = function () {
    if (!this.ctx || !this.on) return;
    var ctx = this.ctx, t = ctx.currentTime;
    var o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(780, t + 0.09);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.25);
  };

  Ambience.prototype.toggle = function (want) {
    if (!AC) return false;
    this.init();
    if (!this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.on = want === undefined ? !this.on : !!want;
    var now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setTargetAtTime(this.on ? 0.34 : 0, now, 0.4);
    return this.on;
  };

  Ambience.prototype.available = function () { return !!AC; };

  root.NPAudio = new Ambience();
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* =============================================================
   script.js — Nil Patel · Agriculture × Innovation
   The scroll drives a camera through a real 3D world. Objects in
   that world carry the portfolio; clicking one flies to it.
   ============================================================= */
(function () {
  'use strict';

  var C = window.NPContent;
  var W = window.NPWorld;
  var A = window.NPAudio;

  var App = {
    /* runtime */
    renderer: null, scene: null, camera: null, world: null,
    posCurve: null, lookCurve: null,
    t: 0, tTarget: 0, tSmooth: 0,
    camPos: null, camLook: null,
    focus: null, hovered: null, activeChapter: null, dismissed: null,
    night: 0, nightTarget: 0,
    mobile: false, reduceMotion: false, entered: false, running: false,
    pointer: { x: 0, y: 0, has: false },
    ndc: null, raycaster: null, rayFrame: 0,
    tour: { active: false, idx: 0, phase: 'move', timer: 0 },
    intro: { flying: false },
    clock: null,
    el: {}
  };

  /* ---------------- small utilities ---------------- */
  function $(id) { return document.getElementById(id); }
  function damp(cur, tgt, lambda, dt) { return cur + (tgt - cur) * (1 - Math.exp(-lambda * dt)); }
  function moveTowards(cur, tgt, step) {
    if (Math.abs(tgt - cur) <= step) return tgt;
    return cur + Math.sign(tgt - cur) * step;
  }
  /* matchMedia is everywhere modern, but never let its absence
     cost the visitor the whole world */
  function isMobile() {
    return window.matchMedia
      ? window.matchMedia('(max-width: 820px), (pointer: coarse)').matches
      : window.innerWidth <= 820;
  }
  function prefersReducedMotion() {
    return window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  }

  function maxScroll() {
    return Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  }
  function chapterT(ch) { return ch.k / (C.path.length - 1); }

  /* =========================================================
     VARIABLE-SPEED SCROLL — normal pace between stops, a slow
     "reading zone" around each chapter so information has time
     to settle before the camera moves on. Built once from the
     chapter positions: a lookup table mapping uniform raw scroll
     (r, 0..1) to the actual journey position (t, 0..1), where dt/dr
     is small near each chapter and larger in transit stretches.
     ========================================================= */
  var rawToT, tToRaw;
  (function buildScrollWarp() {
    var N = 600;
    var PEAK = 3.5;     // how many extra "weight" units a chapter adds at its center
    var SIGMA = 0.014;  // width of the slow zone, in t-units (0..1)
    var centers = C.chapters.map(chapterT);

    var ts = new Array(N), ws = new Array(N), cum = new Array(N);
    for (var i = 0; i < N; i++) {
      var t = i / (N - 1);
      var w = 1;
      for (var c = 0; c < centers.length; c++) {
        var d = t - centers[c];
        w += PEAK * Math.exp(-(d * d) / (2 * SIGMA * SIGMA));
      }
      ts[i] = t;
      ws[i] = w;
    }
    cum[0] = 0;
    for (var j = 1; j < N; j++) {
      cum[j] = cum[j - 1] + (ws[j] + ws[j - 1]) * 0.5 * (ts[j] - ts[j - 1]);
    }
    var total = cum[N - 1];
    var rOfT = new Array(N);
    for (var k = 0; k < N; k++) rOfT[k] = cum[k] / total;

    // raw scroll fraction (uniform, 0..1) -> journey position t (0..1)
    rawToT = function (r) {
      r = Math.min(1, Math.max(0, r));
      var lo = 0, hi = N - 1;
      while (hi - lo > 1) {
        var mid = (lo + hi) >> 1;
        if (rOfT[mid] < r) lo = mid; else hi = mid;
      }
      var span = rOfT[hi] - rOfT[lo];
      var frac = span > 0 ? (r - rOfT[lo]) / span : 0;
      return ts[lo] + (ts[hi] - ts[lo]) * frac;
    };

    // journey position t (0..1) -> raw scroll fraction (0..1) — the inverse,
    // needed whenever code sets the actual page scroll position from a target t
    tToRaw = function (t) {
      t = Math.min(1, Math.max(0, t));
      var pos = t * (N - 1);
      var i0 = Math.floor(pos), i1 = Math.min(N - 1, i0 + 1);
      var frac = pos - i0;
      return rOfT[i0] + (rOfT[i1] - rOfT[i0]) * frac;
    };
  })();

  /* =========================================================
     BOOT — staged so the loading bar reports real progress
     ========================================================= */
  function boot() {
    App.el = {
      canvas: $('scene'),
      intro: $('intro'),
      enter: $('enter'),
      bar: $('bar'),
      loadNote: $('load-note'),
      hud: $('hud'),
      panel: $('panel'),
      panelBody: $('panel-body'),
      panelClose: $('panel-close'),
      rail: $('rail'),
      tip: $('tip'),
      hint: $('hint'),
      mode: $('mode'),
      btnTour: $('btn-tour'),
      btnReset: $('btn-reset'),
      btnSound: $('btn-sound'),
      btnNight: $('btn-night'),
      live: $('live'),
      scroll: $('scroll-track')
    };

    App.mobile = isMobile();
    App.reduceMotion = prefersReducedMotion();

    buildRail();
    setProgress(8, 'Preparing the ground');

    step(function () {
      if (!initRenderer()) return;
      setProgress(28, 'Planting the fields');
      step(function () {
        buildScene();
        setProgress(72, 'Building the farm');
        step(function () {
          App.renderer.compile(App.scene, App.camera);
          setProgress(92, 'Setting the light');
          step(function () {
            bindEvents();
            App.clock = new THREE.Clock();
            App.running = true;
            renderLoop();
            setProgress(100, 'Ready');
            App.el.intro.classList.add('is-ready');
          });
        });
      });
    });
  }

  function step(fn) { requestAnimationFrame(function () { setTimeout(fn, 0); }); }

  function setProgress(p, note) {
    if (App.el.bar) App.el.bar.style.width = p + '%';
    if (App.el.loadNote) App.el.loadNote.textContent = note;
  }

  function fail(msg) {
    App.el.loadNote.textContent = msg;
    App.el.enter.disabled = true;
    App.el.enter.textContent = 'Cannot start';
  }

  /* ---------------- renderer ---------------- */
  function initRenderer() {
    try {
      App.renderer = new THREE.WebGLRenderer({
        canvas: App.el.canvas,
        antialias: !App.mobile,
        powerPreference: 'high-performance'
      });
    } catch (e) {
      fail('This browser could not start WebGL. Try an updated Chrome, Edge, Firefox or Safari.');
      return false;
    }
    if (!App.renderer || !App.renderer.getContext()) {
      fail('WebGL is unavailable on this device.');
      return false;
    }
    var r = App.renderer;
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, App.mobile ? 1.5 : 1.8));
    r.setSize(window.innerWidth, window.innerHeight);
    if ('outputColorSpace' in r && THREE.SRGBColorSpace) r.outputColorSpace = THREE.SRGBColorSpace;
    else if ('outputEncoding' in r && THREE.sRGBEncoding) r.outputEncoding = THREE.sRGBEncoding;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    return true;
  }

  /* ---------------- scene, sky, light ---------------- */
  var sky, sun, hemi, ambient, fog;
  var DAY = { top: new THREE.Color(0x63b8e0), bottom: new THREE.Color(0xdff0dc), fog: new THREE.Color(0xcfe7ea) };
  var NIGHT = { top: new THREE.Color(0x0b1836), bottom: new THREE.Color(0x2c3f57), fog: new THREE.Color(0x1b2b45) };

  function buildScene() {
    App.scene = new THREE.Scene();
    fog = new THREE.Fog(DAY.fog.getHex(), 70, 250);
    App.scene.fog = fog;

    App.camera = new THREE.PerspectiveCamera(App.mobile ? 62 : 52, window.innerWidth / window.innerHeight, 0.5, 600);

    // gradient sky dome
    var skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        topColor: { value: DAY.top.clone() },
        bottomColor: { value: DAY.bottom.clone() },
        offset: { value: 12 }, exponent: { value: 0.7 }
      },
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vP;' +
        'void main(){ float h = normalize(vP + vec3(0.0, offset, 0.0)).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0); }'
    });
    sky = new THREE.Mesh(new THREE.SphereGeometry(320, 24, 16), skyMat);
    App.scene.add(sky);

    hemi = new THREE.HemisphereLight(0xdfefff, 0x6b8a4a, 0.55);
    App.scene.add(hemi);
    ambient = new THREE.AmbientLight(0xfff2d8, 0.35);
    App.scene.add(ambient);

    sun = new THREE.DirectionalLight(0xfff0c9, 1.55);
    sun.position.set(38, 46, 26);
    sun.castShadow = true;
    var s = App.mobile ? 1024 : 2048;
    sun.shadow.mapSize.set(s, s);
    sun.shadow.camera.near = 5;
    sun.shadow.camera.far = 180;
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    sun.shadow.bias = -0.0008;
    sun.shadow.normalBias = 0.035;
    App.scene.add(sun);
    App.scene.add(sun.target);

    App.world = W.build(App.scene, { mobile: App.mobile });

    // journey curves
    var posPts = C.path.map(function (k) { return new THREE.Vector3(k.pos[0], k.pos[1], k.pos[2]); });
    var lookPts = C.path.map(function (k) { return new THREE.Vector3(k.look[0], k.look[1], k.look[2]); });
    App.posCurve = new THREE.CatmullRomCurve3(posPts, false, 'centripetal', 0.5);
    App.lookCurve = new THREE.CatmullRomCurve3(lookPts, false, 'centripetal', 0.5);

    App.camPos = App.posCurve.getPoint(0).clone();
    App.camLook = App.lookCurve.getPoint(0).clone();
    App.camera.position.copy(App.camPos);
    App.camera.lookAt(App.camLook);

    // hover rings under interactive objects
    App.world.interactive.forEach(function (it) {
      var ring = new THREE.Mesh(
        new THREE.RingGeometry(it.r * 0.92, it.r * 1.06, 40),
        new THREE.MeshBasicMaterial({ color: 0xe08a3c, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.09;
      ring.renderOrder = 2;
      it.obj.add(ring);
      it.ring = ring;
      it.hoverAmt = 0;
      it.baseY = it.obj.position.y;
      it.chapter = C.byObject(it.id);
    });

    App.raycaster = new THREE.Raycaster();
    App.ndc = new THREE.Vector2();
  }

  /* =========================================================
     UI — rail, panel, tooltip
     ========================================================= */
  function buildRail() {
    var frag = document.createDocumentFragment();
    C.chapters.forEach(function (ch, i) {
      var b = document.createElement('button');
      b.className = 'rail-item';
      b.type = 'button';
      b.dataset.id = ch.id;
      b.setAttribute('aria-label', 'Go to ' + ch.nav);
      b.innerHTML = '<span class="rail-seed" aria-hidden="true"></span><span class="rail-name">' + ch.nav + '</span>';
      b.addEventListener('click', function () { goToChapter(ch, true); });
      frag.appendChild(b);
    });
    App.el.rail.appendChild(frag);
  }

  function markRail(id) {
    var items = App.el.rail.querySelectorAll('.rail-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('is-current', items[i].dataset.id === id);
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderPanel(ch) {
    var h = '';
    h += '<p class="kicker">' + esc(ch.kicker) + '</p>';
    h += '<h2>' + esc(ch.title) + '</h2>';
    ch.blocks.forEach(function (b) {
      if (b.t === 'lead') h += '<p class="lead">' + esc(b.v) + '</p>';
      else if (b.t === 'p') h += '<p>' + esc(b.v) + '</p>';
      else if (b.t === 'sub') h += '<p class="sub">' + esc(b.v) + '</p>';
      else if (b.t === 'years') h += '<p class="years">' + esc(b.v) + '</p>';
      else if (b.t === 'facts') {
        h += '<dl class="facts">';
        b.v.forEach(function (row) {
          h += '<dt>' + esc(row[0]) + '</dt><dd>' + esc(row[1]) + '</dd>';
        });
        h += '</dl>';
      } else if (b.t === 'group') {
        h += '<h3>' + esc(b.v.head) + '</h3><ul class="rows">';
        b.v.items.forEach(function (it) { h += '<li>' + esc(it) + '</li>'; });
        h += '</ul>';
      } else if (b.t === 'entry') {
        h += '<div class="entry"><p class="entry-head">' + esc(b.v.head) + '</p>' +
          '<p class="entry-meta">' + esc(b.v.place) + '</p>' +
          '<p class="entry-when">' + esc(b.v.when) + '</p></div>';
      } else if (b.t === 'tags') {
        h += '<ul class="tags">';
        b.v.forEach(function (it) { h += '<li>' + esc(it) + '</li>'; });
        h += '</ul>';
      } else if (b.t === 'link') {
        var dl = b.v.download ? ' download="' + esc(b.v.download) + '"' : '';
        h += '<a class="cta" href="' + esc(b.v.href) + '" target="_blank" rel="noopener noreferrer"' + dl + '>' + esc(b.v.label) + '</a>';
      } else if (b.t === 'foot') {
        h += '<p class="foot">' + b.v.map(esc).join('<br>') + '</p>';
      }
    });
    App.el.panelBody.innerHTML = h;
    App.el.panel.classList.add('is-open');
    App.el.panel.setAttribute('aria-hidden', 'false');
    App.el.live.textContent = ch.title + '. ' + ch.kicker + '.';
    markRail(ch.id);
    if (A && A.on) A.blip();
  }

  function openChapter(ch) {
    if (App.activeChapter === ch && App.el.panel.classList.contains('is-open')) return;
    App.activeChapter = ch;
    App.dismissed = null;
    renderPanel(ch);
  }

  function closePanel(byUser) {
    App.el.panel.classList.remove('is-open');
    App.el.panel.setAttribute('aria-hidden', 'true');
    if (byUser) App.dismissed = App.activeChapter;
    if (App.focus) releaseFocus();
  }

  /* =========================================================
     CAMERA — path, focus, chapter jumps
     ========================================================= */
  function goToChapter(ch, openIt) {
    stopTour();
    if (App.focus) releaseFocus();
    var t = chapterT(ch);
    App.tTarget = t;
    syncScroll(t);
    if (openIt) openChapter(ch);
  }

  var ignoreScrollUntil = 0;
  function syncScroll(t) {
    ignoreScrollUntil = performance.now() + 260;
    window.scrollTo(0, tToRaw(t) * maxScroll());
  }

  function focusObject(it) {
    var ch = it.chapter;
    if (!ch) return;
    stopTour();
    var t = chapterT(ch);
    App.tTarget = t;
    syncScroll(t);

    var target = new THREE.Vector3(it.focus[0], it.focus[1], it.focus[2]);
    var from = App.posCurve.getPoint(t);
    var dir = from.clone().sub(target);
    dir.y = 0;
    if (dir.lengthSq() < 0.001) dir.set(0, 0, 1);
    dir.normalize();
    var dist = it.r * 1.75 + (App.mobile ? 3.4 : 2.2);
    var pos = target.clone().add(dir.multiplyScalar(dist));
    pos.y = target.y + it.r * 0.45 + 1.0;
    App.focus = { pos: pos, look: target, it: it };
    openChapter(ch);
  }

  function releaseFocus() {
    App.focus = null;
  }

  /* =========================================================
     GUIDED TOUR
     ========================================================= */
  function startTour() {
    if (App.focus) releaseFocus();
    App.tour.active = true;
    App.tour.idx = 0;
    App.tour.phase = 'move';
    App.tour.timer = 0;
    App.el.btnTour.textContent = 'Stop tour';
    App.el.btnTour.setAttribute('aria-pressed', 'true');
    App.el.mode.textContent = 'Guided tour';
    document.body.classList.add('touring');
  }

  function stopTour() {
    if (!App.tour.active) return;
    App.tour.active = false;
    App.el.btnTour.textContent = 'Guided tour';
    App.el.btnTour.setAttribute('aria-pressed', 'false');
    App.el.mode.textContent = 'Explore';
    document.body.classList.remove('touring');
    syncScroll(App.tSmooth);
  }

  function updateTour(dt) {
    var ch = C.chapters[App.tour.idx];
    if (!ch) { stopTour(); return; }
    var target = chapterT(ch);
    if (App.tour.phase === 'move') {
      App.tTarget = moveTowards(App.tTarget, target, dt * 0.036);
      syncScroll(App.tSmooth);
      if (App.tTarget === target && Math.abs(App.tSmooth - target) < 0.004) {
        App.tour.phase = 'dwell';
        App.tour.timer = 0;
        openChapter(ch);
      }
    } else {
      App.tour.timer += dt;
      if (App.tour.timer > 5.5) {
        App.tour.idx++;
        App.tour.phase = 'move';
        if (App.tour.idx >= C.chapters.length) {
          stopTour();
        }
      }
    }
  }

  /* =========================================================
     INPUT
     ========================================================= */
  function bindEvents() {
    window.addEventListener('resize', onResize, { passive: true });
    window.addEventListener('orientationchange', onResize, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });

    App.el.enter.addEventListener('click', enterWorld);
    App.el.panelClose.addEventListener('click', function () { closePanel(true); });

    App.el.btnTour.addEventListener('click', function () {
      if (App.tour.active) stopTour(); else startTour();
    });
    App.el.btnReset.addEventListener('click', resetJourney);
    App.el.btnSound.addEventListener('click', function () {
      var on = A.toggle();
      App.el.btnSound.textContent = on ? 'Sound on' : 'Sound off';
      App.el.btnSound.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    App.el.btnNight.addEventListener('click', function () {
      App.nightTarget = App.nightTarget > 0.5 ? 0 : 1;
      var isNight = App.nightTarget > 0.5;
      App.el.btnNight.textContent = isNight ? 'Daytime' : 'Nighttime';
      App.el.btnNight.setAttribute('aria-pressed', isNight ? 'true' : 'false');
    });

    var cv = App.el.canvas;
    cv.addEventListener('pointermove', onPointerMove, { passive: true });
    cv.addEventListener('pointerleave', function () {
      App.pointer.has = false;
      setHovered(null);
    }, { passive: true });
    cv.addEventListener('click', onClick);
    cv.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1) {
        var t = e.touches[0];
        App.ndc.x = (t.clientX / window.innerWidth) * 2 - 1;
        App.ndc.y = -(t.clientY / window.innerHeight) * 2 + 1;
        App.pointer.has = true;
      }
    }, { passive: true });

    // any deliberate input stops the tour / intro flight
    ['wheel', 'touchmove', 'keydown', 'mousedown'].forEach(function (ev) {
      window.addEventListener(ev, function () {
        if (App.tour.active) stopTour();
        App.intro.flying = false;
      }, { passive: true });
    });

    document.addEventListener('keydown', onKey);
  }

  function onResize() {
    if (!App.renderer) return;
    App.mobile = isMobile();
    App.camera.aspect = window.innerWidth / window.innerHeight;
    App.camera.fov = App.mobile ? 62 : 52;
    App.camera.updateProjectionMatrix();
    App.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, App.mobile ? 1.5 : 1.8));
    App.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onScroll() {
    if (!App.entered) return;
    if (App.tour.active || App.intro.flying) return;
    if (performance.now() < ignoreScrollUntil) return;
    if (App.focus) releaseFocus();
    App.tTarget = rawToT(window.scrollY / maxScroll());
    if (App.el.hint && !App.el.hint.classList.contains('is-gone') && App.tTarget > 0.02) {
      App.el.hint.classList.add('is-gone');
    }
  }

  function onPointerMove(e) {
    App.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    App.pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    App.pointer.has = true;
    App.ndc.x = App.pointer.x;
    App.ndc.y = -App.pointer.y;
    if (App.el.tip.classList.contains('is-on')) {
      positionTip(e.clientX, e.clientY);
    }
  }

  function positionTip(x, y) {
    var pad = 16;
    var w = App.el.tip.offsetWidth || 160;
    var left = Math.min(window.innerWidth - w - pad, Math.max(pad, x + 18));
    var top = Math.min(window.innerHeight - 60, Math.max(pad, y - 34));
    App.el.tip.style.transform = 'translate(' + left + 'px,' + top + 'px)';
  }

  function onClick(e) {
    if (!App.entered) return;
    App.ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
    App.ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    var hit = pick();
    if (hit) {
      focusObject(hit);
    } else if (App.focus) {
      releaseFocus();
      closePanel(false);
    }
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      if (App.tour.active) stopTour();
      closePanel(true);
      return;
    }
    if (e.key >= '1' && e.key <= '9') {
      var i = parseInt(e.key, 10) - 1;
      if (C.chapters[i]) {
        goToChapter(C.chapters[i], true);
        e.preventDefault();
      }
    }
    if (e.key.toLowerCase() === 't') {
      if (App.tour.active) stopTour(); else startTour();
    }
  }

  function resetJourney() {
    stopTour();
    releaseFocus();
    closePanel(false);
    App.activeChapter = null;
    App.tTarget = 0;
    syncScroll(0);
    markRail(null);
  }

  function enterWorld() {
    if (App.entered) return;
    App.entered = true;
    document.body.classList.remove('locked');
    App.el.intro.classList.add('is-gone');
    App.el.hud.classList.add('is-on');
    window.scrollTo(0, 0);
    setTimeout(function () { App.el.intro.style.display = 'none'; }, 900);
    if (!App.reduceMotion) {
      App.intro.flying = true;
    }
    App.el.enter.blur();
  }

  /* =========================================================
     PICKING & HOVER
     ========================================================= */
  function pick() {
    if (!App.world) return null;
    App.raycaster.setFromCamera(App.ndc, App.camera);
    var objs = App.world.interactive.map(function (it) { return it.obj; });
    var hits = App.raycaster.intersectObjects(objs, true);
    if (!hits.length) return null;
    var node = hits[0].object;
    while (node && !node.userData.npId) node = node.parent;
    if (!node) return null;
    for (var i = 0; i < App.world.interactive.length; i++) {
      if (App.world.interactive[i].obj === node) return App.world.interactive[i];
    }
    return null;
  }

  function setHovered(it) {
    if (App.hovered === it) return;
    App.hovered = it;
    if (it) {
      App.el.tip.textContent = C.labels[it.id] || '';
      App.el.tip.classList.add('is-on');
      document.body.classList.add('pointing');
    } else {
      App.el.tip.classList.remove('is-on');
      document.body.classList.remove('pointing');
    }
  }

  /* =========================================================
     FRAME LOOP
     ========================================================= */
  function renderLoop() {
    requestAnimationFrame(renderLoop);
    if (!App.running) return;
    var dt = Math.min(0.05, App.clock.getDelta());
    var time = App.clock.elapsedTime;

    // intro flight after "Enter the world"
    if (App.intro.flying) {
      var goal = chapterT(C.chapters[0]);
      App.tTarget = moveTowards(App.tTarget, goal, dt * 0.062);
      syncScroll(App.tSmooth);
      if (App.tTarget === goal && Math.abs(App.tSmooth - goal) < 0.006) {
        App.intro.flying = false;
        syncScroll(goal);
      }
    }

    if (App.tour.active) updateTour(dt);

    // smooth the journey parameter
    App.tSmooth = damp(App.tSmooth, App.tTarget, App.reduceMotion ? 12 : 3.4, dt);
    App.tSmooth = Math.min(1, Math.max(0, App.tSmooth));

    // desired camera pose
    var wantPos, wantLook, lam;
    if (App.focus) {
      wantPos = App.focus.pos;
      wantLook = App.focus.look;
      lam = App.reduceMotion ? 12 : 2.4;
    } else {
      wantPos = App.posCurve.getPoint(App.tSmooth);
      wantLook = App.lookCurve.getPoint(App.tSmooth);
      lam = App.reduceMotion ? 14 : 4.0;
    }

    App.camPos.x = damp(App.camPos.x, wantPos.x, lam, dt);
    App.camPos.y = damp(App.camPos.y, wantPos.y, lam, dt);
    App.camPos.z = damp(App.camPos.z, wantPos.z, lam, dt);
    App.camLook.x = damp(App.camLook.x, wantLook.x, lam, dt);
    App.camLook.y = damp(App.camLook.y, wantLook.y, lam, dt);
    App.camLook.z = damp(App.camLook.z, wantLook.z, lam, dt);

    App.camera.position.copy(App.camPos);
    if (!App.reduceMotion) {
      // gentle breathing + a little parallax from the pointer
      App.camera.position.y += Math.sin(time * 0.6) * 0.06;
      if (App.pointer.has && !App.mobile) {
        App.camera.position.x += App.pointer.x * 0.5;
        App.camera.position.y += -App.pointer.y * 0.28;
      }
    }
    App.camera.lookAt(App.camLook);

    // keep the sun's shadow box around the camera
    sun.position.set(App.camPos.x + 38, 48, App.camPos.z + 26);
    sun.target.position.set(App.camPos.x, 0, App.camPos.z);
    sun.target.updateMatrixWorld();
    sky.position.set(App.camPos.x, 0, App.camPos.z);

    // hover picking, every other frame
    App.rayFrame++;
    if (App.entered && App.pointer.has && !App.mobile && (App.rayFrame % 2 === 0)) {
      setHovered(pick());
    }

    // hover feedback on the objects themselves
    var list = App.world.interactive;
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      var want = (it === App.hovered || (App.focus && App.focus.it === it)) ? 1 : 0;
      it.hoverAmt = damp(it.hoverAmt, want, 8, dt);
      if (it.hoverAmt > 0.002) {
        it.ring.material.opacity = it.hoverAmt * 0.55;
        it.ring.scale.setScalar(0.94 + it.hoverAmt * 0.06 + Math.sin(time * 2.4) * 0.01 * it.hoverAmt);
        it.obj.position.y = it.baseY + it.hoverAmt * 0.12;
      } else if (it.ring.material.opacity !== 0) {
        it.ring.material.opacity = 0;
        it.obj.position.y = it.baseY;
      }
    }

    // chapter reveal as the journey passes each station. This only
    // applies while the camera is travelling with the scroll — during
    // a jump to a distant chapter the note that was asked for stays put
    // instead of being replaced by every station along the way.
    var settled = Math.abs(App.tTarget - App.tSmooth) < 0.02;
    if (App.entered && !App.focus && settled) {
      var near = null, bestD = 1;
      for (var c = 0; c < C.chapters.length; c++) {
        var d = Math.abs(App.tSmooth - chapterT(C.chapters[c]));
        if (d < bestD) { bestD = d; near = C.chapters[c]; }
      }
      if (near && bestD < 0.018) {
        if (App.dismissed !== near) openChapter(near);
      } else if (bestD > 0.032 && App.el.panel.classList.contains('is-open') && !App.tour.active) {
        closePanel(false);
        App.activeChapter = null;
        App.dismissed = null;
        markRail(null);
      }
    }

    // day / night
    if (Math.abs(App.night - App.nightTarget) > 0.001) {
      App.night = damp(App.night, App.nightTarget, 1.4, dt);
      applyNight(App.night);
    }

    App.world.animate(time, dt);
    App.renderer.render(App.scene, App.camera);
  }

  var _c1 = new THREE.Color(), _c2 = new THREE.Color();
  function applyNight(k) {
    sky.material.uniforms.topColor.value.copy(DAY.top).lerp(NIGHT.top, k);
    sky.material.uniforms.bottomColor.value.copy(DAY.bottom).lerp(NIGHT.bottom, k);
    fog.color.copy(DAY.fog).lerp(NIGHT.fog, k);
    fog.near = 70 - k * 24;
    fog.far = 250 - k * 90;
    sun.intensity = 1.55 * (1 - k) + 0.16 * k;
    _c1.setHex(0xfff0c9); _c2.setHex(0x9fb6ff);
    sun.color.copy(_c1).lerp(_c2, k);
    hemi.intensity = 0.55 * (1 - k) + 0.16 * k;
    ambient.intensity = 0.35 * (1 - k) + 0.14 * k;
    App.world.setNight(k);
    document.body.classList.toggle('is-night', k > 0.5);
  }

  /* ---------------- go ---------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
